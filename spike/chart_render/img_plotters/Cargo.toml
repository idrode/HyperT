[package]
name = "img_plotters"
version = "0.1.0"
edition = "2021"
description = "Candidato A: plotters rasteriza el oscilador a píxeles, ratatui-image lo pinta vía Kitty (fallback halfblocks)"

[dependencies]
rsi_data = { path = "../rsi_data" }
# ratatui-image 11 exige ratatui ^0.30.1 (¡producción está en 0.29!)
ratatui = "0.30"
crossterm = "0.29"
# default-features off: "chafa-dyn" exige libchafa del sistema (no instalada);
# para Kitty/halfblocks no hace falta chafa
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png"] }
plotters = { version = "0.3", default-features = false, features = ["bitmap_backend", "line_series", "ttf"] }
anyhow = "1"
